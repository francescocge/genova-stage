name: Aggiorna eventi
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils
      - run: python test_parser.py
      - run: python aggiorna_eventi.py
      - name: Salva se è cambiato qualcosa
        run: |
          git config user.name "aggiornamento-eventi"
          git config user.email "actions@users.noreply.github.com"
          git add events-data.json
          git diff --cached --quiet || (git commit -m "Aggiornamento eventi $(date +%F)" && git push)
