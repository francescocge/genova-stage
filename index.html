<style>
:root{--bg:#0e1a2b;--card:#16263b;--card2:#1d3150;--gold:#d4af37;--gold2:#f0dc8c;--txt:#f3f5f8;--dim:#9fb0c6;--line:#2a3f5e}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh;font-size:16px}
header{position:relative;z-index:50;background:linear-gradient(180deg,#14243a,var(--bg));padding:18px 14px 12px;border-bottom:1px solid var(--line);text-align:center}
h1{font-size:1.6rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.ver{font-size:.75rem;color:var(--dim);margin:2px 0 12px}
.ctl{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
input,select{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:1rem;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:.95rem;font-weight:600;cursor:pointer}
.tab.on{background:linear-gradient(180deg,#e6c758,#b8932a);color:#1a1405;border-color:var(--gold);box-shadow:0 4px 0 #7d6417}
.count{font-size:.8rem;color:var(--dim);padding:12px 16px 0;max-width:1100px;margin:0 auto}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding:14px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;gap:14px;padding:16px;align-items:center;background:linear-gradient(135deg,var(--card2),var(--card))}
.dt{min-width:64px;text-align:center;border:1px solid var(--gold);border-radius:14px;padding:8px 4px;background:#0e1a2b}
.dt b{display:block;font-size:1.7rem;color:var(--gold2);line-height:1}
.dt span{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--gold);color:#1a1405;margin-bottom:6px}
.tag.c{background:#7fb2ff;color:#06182e}
.art{font-size:1.1rem;font-weight:700;line-height:1.25}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ti{color:var(--gold2);font-size:.92rem}
.ve{color:var(--dim);font-size:.88rem}
.pr{font-size:.9rem;font-weight:600}
.btn{margin-top:auto;display:block;width:100%;padding:13px;border-radius:14px;border:none;font-size:1rem;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;color:#1a1405;background:linear-gradient(180deg,#e6c758,#b8932a);box-shadow:0 4px 0 #7d6417}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d6417}
.btn.s{background:linear-gradient(180deg,#2c4468,#1f3252);color:var(--gold2);box-shadow:0 4px 0 #101c30;margin-top:10px}
.poster{height:230px;background:#0e1a2b}.poster img{width:100%;height:100%;object-fit:cover;display:block}.mposter{margin:-22px -22px 16px;border-radius:20px 20px 0 0;overflow:hidden;max-height:320px}.mposter img{width:100%;display:block;object-fit:cover}.x{z-index:2;text-shadow:0 0 6px #000}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:.9rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--card2);color:var(--gold2);border-color:var(--gold)}
.orari{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ora{padding:7px 11px;border-radius:10px;border:1px solid var(--gold);background:var(--bg);color:var(--gold2);font-size:.88rem;font-weight:700;text-decoration:none}
main.cin{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.film{display:flex;gap:14px;padding:14px 14px 8px}
.film img{width:96px;height:144px;object-fit:cover;border-radius:10px;flex:none;background:var(--bg)}
.fi{min-width:0}
.ft{font-size:1.2rem;font-weight:800;line-height:1.2;margin-bottom:6px;color:#fff}
.fx{font-size:.82rem;color:var(--dim);margin-top:6px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:40px 10px}
.modal{display:none;position:fixed;inset:0;background:rgba(5,10,20,.85);z-index:100;padding:16px;overflow-y:auto}
.mc{background:var(--card);border:1px solid var(--gold);border-radius:20px;max-width:500px;margin:24px auto;padding:22px;position:relative}
.x{position:absolute;top:10px;right:14px;font-size:1.8rem;color:var(--dim);cursor:pointer;background:none;border:none}
.pb{background:var(--bg);border-left:4px solid var(--gold);padding:12px;border-radius:8px;margin:14px 0;font-size:.95rem}
.pb small{display:block;color:var(--dim);margin-top:4px}
</style>
