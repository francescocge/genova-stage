<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genova Stage - Teatri & Concerti</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f0f11;
            --bg-card: #18181b;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #f4f4f5;
            --text-dim: #a1a1aa;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-light); min-height: 100vh; }

        header {
            background: linear-gradient(180deg, #18181b 0%, var(--bg-primary) 100%);
            padding: 24px 16px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title { font-size: 1.8rem; color: var(--gold-primary); font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
        .brand-subtitle { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px; }

        .controls-panel { display: flex; flex-direction: column; gap: 10px; max-width: 800px; margin: 0 auto; }
        .search-bar { width: 100%; padding: 12px 16px; border-radius: 25px; border: 1px solid var(--border-color); background: var(--bg-card); color: #fff; font-size: 0.95rem; outline: none; }
        .search-bar:focus { border-color: var(--gold-primary); }

        .filter-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .filter-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-dim); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; white-space: nowrap; cursor: pointer; }
        .filter-btn.active { background: var(--gold-primary); color: #000; font-weight: bold; border-color: var(--gold-primary); }

        .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px 16px; max-width: 1200px; margin: 0 auto; }
        .event-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.2s ease; }
        .event-card:hover { transform: translateY(-4px); border-color: var(--gold-primary); }

        .poster-wrapper { position: relative; width: 100%; height: 320px; background: #1e1e24; display: flex; align-items: center; justify-content: center; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-date { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.85); border: 1px solid var(--gold-primary); color: var(--gold-light); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-price { position: absolute; bottom: 12px; left: 12px; background: rgba(212,175,55,0.95); color: #000; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; }

        .event-details { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .event-artist { font-size: 1.15rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .event-title { font-size: 0.9rem; color: var(--gold-light); margin-bottom: 8px; }
        .event-venue { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

        .action-btn { margin-top: auto; width: 100%; padding: 10px; background: linear-gradient(135deg, var(--gold-primary), #b8860b); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .ticket-btn { margin-top: 8px; width: 100%; padding: 10px; background: #27272a; color: var(--gold-light); border: 1px solid var(--gold-primary); border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; padding: 20px; overflow-y: auto; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--gold-primary); border-radius: 16px; max-width: 500px; margin: 40px auto; padding: 24px; position: relative; }
        .close-btn { position: absolute; top: 16px; right: 16px; color: var(--text-dim); font-size: 1.4rem; cursor: pointer; }
        .price-box { background: #27272a; border-left: 4px solid var(--gold-primary); padding: 10px; border-radius: 4px; font-size: 0.9rem; margin-bottom: 16px; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="brand-title"><i class="fa-solid fa-masks-theater"></i> Genova Stage</div>
        <div class="brand-subtitle">Concerti, Cabaret, Opera & Teatri a Genova (Aggiornato Automaticamente)</div>
        
        <div class="controls-panel">
            <input type="text" id="searchInput" class="search-bar" placeholder="Cerca artista, concerto o teatro..." onkeyup="filterEvents()">
            
            <div class="filter-group" id="venueFilters">
                <button class="filter-btn active" onclick="setFilter('venue', 'all', this)">Tutti i Teatri</button>
                <button class="filter-btn" onclick="setFilter('venue', 'Politeama Genovese', this)">Politeama Genovese</button>
                <button class="filter-btn" onclick="setFilter('venue', 'Teatro Carlo Felice', this)">Carlo Felice</button>
                <button class="filter-btn" onclick="setFilter('venue', 'Teatro Nazionale', this)">Teatro Nazionale</button>
                <button class="filter-btn" onclick="setFilter('venue', 'Teatro Govi', this)">Teatro Govi</button>
                <button class="filter-btn" onclick="setFilter('venue', 'Arena del Mare', this)">Arena del Mare</button>
                <button class="filter-btn" onclick="setFilter('venue', 'Teatro della Tosse', this)">Teatro della Tosse</button>
            </div>
        </div>
    </header>

    <main class="events-grid" id="eventsGrid"></main>

    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalArtist" style="color: var(--gold-primary); margin-bottom: 4px;"></h2>
            <h4 id="modalTitle" style="color: #fff; margin-bottom: 8px;"></h4>
            <p id="modalVenue" style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 8px;"></p>
            <p id="modalDate" style="color: var(--gold-light); font-weight: bold; margin-bottom: 12px;"></p>
            
            <div class="price-box" id="modalPrice"></div>
            
            <p id="modalDesc" style="font-size: 0.9rem; line-height: 1.5; color: var(--text-light); margin-bottom: 20px;"></p>
            
            <a id="modalTicketLink" href="#" target="_blank" class="ticket-btn"><i class="fa-solid fa-ticket"></i> Acquista Biglietti Online</a>
            <button class="action-btn" style="margin-top: 10px;" onclick="downloadICS()"><i class="fa-solid fa-calendar-plus"></i> Salva nel Calendario (.ics)</button>
        </div>
    </div>

    <script>
        let currentEvents = [];
        let activeVenueFilter = 'all';
        let selectedEvent = null;

        async function loadEvents() {
            try {
                const res = await fetch('events-data.json');
                if (res.ok) {
                    currentEvents = await res.json();
                }
            } catch (e) {
                console.log('Errore caricamento dati');
            }
            renderEvents();
        }

        function renderEvents() {
            const grid = document.getElementById('eventsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            
            const filtered = currentEvents.filter(ev => {
                const matchVenue = activeVenueFilter === 'all' || ev.venue.includes(activeVenueFilter);
                const matchSearch = ev.artist.toLowerCase().includes(searchVal) || ev.title.toLowerCase().includes(searchVal);
                return matchVenue && matchSearch;
            });

            filtered.forEach((ev, idx) => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${ev.img}" alt="${ev.artist}">
                        <div class="badge-date">${ev.date}</div>
                        <div class="badge-price">${ev.price ? ev.price.split(' ')[0] + ' ' + (ev.price.split(' ')[1] || '') : ''}</div>
                    </div>
                    <div class="event-details">
                        <div class="event-artist">${ev.artist}</div>
                        <div class="event-title">${ev.title}</div>
                        <div class="event-venue"><i class="fa-solid fa-location-dot"></i> ${ev.venue}</div>
                        <button class="action-btn" onclick="openModal(${idx})">Info & Prezzi</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setFilter(type, value, btn) {
            document.querySelectorAll('#venueFilters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeVenueFilter = value;
            renderEvents();
        }

        function filterEvents() { renderEvents(); }

        function openModal(idx) {
            selectedEvent = currentEvents[idx];
            document.getElementById('modalArtist').innerText = selectedEvent.artist;
            document.getElementById('modalTitle').innerText = selectedEvent.title;
            document.getElementById('modalVenue').innerText = selectedEvent.venue;
            document.getElementById('modalDate').innerText = 'Data: ' + selectedEvent.date;
            document.getElementById('modalPrice').innerHTML = '<strong><i class="fa-solid fa-tag"></i> Prezzo:</strong> ' + selectedEvent.price;
            document.getElementById('modalDesc').innerText = selectedEvent.desc;
            document.getElementById('modalTicketLink').href = selectedEvent.ticketUrl;
            document.getElementById('eventModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('eventModal').style.display = 'none'; }

        function downloadICS() {
            if (!selectedEvent) return;
            const icsData = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${selectedEvent.artist} - ${selectedEvent.title}\nLOCATION:${selectedEvent.venue}, Genova\nEND:VEVENT\nEND:VCALENDAR`;
            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `${selectedEvent.artist.replace(/\s+/g, '_')}_Genova.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        loadEvents();
    </script>
</body>
</html>
